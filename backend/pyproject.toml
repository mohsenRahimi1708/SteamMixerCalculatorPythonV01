[project]
name = "platensh-backend"
version = "4.0.0"
description = "Platen superheater digital twin backend (IAPWS-IF97, FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "iapws>=1.5.4,<2.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "hypothesis>=6.100", "httpx>=0.28", "websockets>=14.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.api", "app.core", "app.db", "app.models", "app.thermo"]
