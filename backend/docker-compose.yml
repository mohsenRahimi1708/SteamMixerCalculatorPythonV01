services:
  backend:
    build: .
    container_name: platensh-backend
    restart: unless-stopped
    environment:
      PST_DB_PATH: /data/platensh.db
      PST_LOG_LEVEL: INFO
      PST_RATE_LIMIT_PER_MINUTE: "600"
    volumes:
      - platensh-data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  proxy:
    image: nginx:1.27-alpine
    container_name: platensh-proxy
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro

volumes:
  platensh-data:
